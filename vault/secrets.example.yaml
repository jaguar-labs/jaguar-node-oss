# Secrets contract for jaguar-node playbooks.
#
# Setup:
#   1. Copy this file:            cp vault/secrets.example.yaml vault/secrets.yaml
#   2. Fill in the real values below.
#   3. Encrypt it in place:       ansible-vault encrypt vault/secrets.yaml
#   4. Run playbooks with:        --ask-vault-pass  (or --vault-password-file <path>)
#
# Never commit an unencrypted secrets file. `vault/secrets.yaml` must only ever
# be committed in its ansible-vault encrypted form.
---
telegraf_username: "CHANGE_ME"
telegraf_password: "CHANGE_ME"
pager_duty_key: "CHANGE_ME"
solana_metrics_user: "CHANGE_ME"
solana_metrics_password: "CHANGE_ME"
