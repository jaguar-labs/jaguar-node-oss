- name: Create mount directories
  file:
    path: "{{ item.mount_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  with_items: "{{ disk_management.disks }}"
  when: disk_management.mount

- name: Detect current filesystem on each disk
  command: "blkid -s TYPE -o value {{ item.dev }}"
  register: disk_current_fstype
  changed_when: false
  failed_when: false
  check_mode: no
  with_items: "{{ disk_management.disks }}"
  when: disk_management.mount

- name: Format disk (only when current fstype differs from requested)
  community.general.filesystem:
    fstype: "{{ item.item.fs_type }}"
    dev: "{{ item.item.dev }}"
    force: "{{ item.item.force | default(false) }}"
  loop: "{{ disk_current_fstype.results }}"
  loop_control:
    label: "{{ item.item.dev }} ({{ item.stdout or 'none' }} -> {{ item.item.fs_type }})"
  when:
    - disk_management.mount
    - item.stdout != item.item.fs_type

- name: Look up filesystem UUIDs
  command: blkid -s UUID -o value {{ item.dev }}
  register: disk_uuids
  changed_when: false
  with_items: "{{ disk_management.disks }}"
  when: disk_management.mount

- name: Mount disks by UUID
  mount:
    path: "{{ item.item.mount_dir }}"
    src: "UUID={{ item.stdout }}"
    fstype: "{{ item.item.fs_type }}"
    opts: "{{ item.item.options }}"
    state: mounted
  loop: "{{ disk_uuids.results }}"
  when: disk_management.mount

- name: Create sub directories
  file:
    path: "{{ item.mount_dir }}/{{ item.subdir }}"
    state: directory
    owner: "{{ solana_user }}"
    group: "{{ solana_user }}"
    mode: '0755'
  with_items: "{{ disk_management.disks }}"
  when: disk_management.config