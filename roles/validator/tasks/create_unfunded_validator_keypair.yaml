---
- name: Check if unfunded_validator_keypair.json exists
  stat:
    path: "{{ secrets_path }}/unfunded-validator-keypair.json"
  register: unfunded_validator_keypair
  tags:
    - create.unfunded_validator_keypair

- name: Create an unfunded validator keypair to transition between active voting and none voting node
  shell: solana-keygen new -s --no-bip39-passphrase -o {{ secrets_path }}/unfunded-validator-keypair.json
  become: yes
  become_user: "{{ solana_user }}"
  environment:
    PATH: "{{ env_path }}"
  when: not unfunded_validator_keypair.stat.exists
  tags:
    - create.unfunded_validator_keypair

# validator-keypair.json is operational state: which identity this host boots
# with. Created once pointing at the unfunded key (a fresh host never votes
# until an operator transitions to it) and never moved by the playbook again;
# operators and node-transition.sh move it.
- name: Check whether the validator keypair symlink already exists
  stat:
    path: "{{ secrets_path }}/validator-keypair.json"
  register: validator_keypair_link
  tags:
    - validator.unfunded_validator_keypair

- name: Create the validator keypair symlink (unfunded, only when absent)
  ansible.builtin.file:
    src: "{{ secrets_path }}/unfunded-validator-keypair.json"
    dest: "{{ secrets_path }}/validator-keypair.json"
    owner: "{{ solana_user}}"
    group: "{{ solana_user}}"
    state: link
  when: not validator_keypair_link.stat.exists
  tags:
    - validator.unfunded_validator_keypair
