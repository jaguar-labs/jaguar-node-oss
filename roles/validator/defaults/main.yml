---
solana_user: solana
solana_home: "/home/{{ solana_user }}"
secrets_path: "{{ solana_home }}/.secrets"
env_path: "{{ solana_home }}/.local/share/solana/install/active_release/bin"
rpc_port: 8899
rpc_bind_address: 0.0.0.0
dynamic_port_range: 8000-10000
expected_genesis_hash: 5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d
jito:
  enabled: True
  tip_payment_program_pubkey: T1pyyaTNZsKv2WcRAB8oVnk93mLJw2XzjtVYqCsaHqt
  tip_distribution_program_pubkey: 4R3gSG8BpU4t19KYj8CfnbtRpnT8gtk4dvTHxVRwc2r7
  merkle_root_upload_authority: GZctHpWXmsZC1YHACTGGcHhYxjdRqQvTpYkb9LMvxDib
  commission_bps: 800
  block_engine_url: https://ny.mainnet.block-engine.jito.wtf
  shred_receiver_address: 141.98.216.96:1002
alpenglow:
  enabled: false
xdp:
  enabled: false
  interface: ""
  retransmit_cpu_cores: "1"
  zero_copy: true
  ring_rx: 512
  ring_tx: 512
  combined_queues: ""
# Hot-swap peers this host can hand the voting identity to, one entry per name
# (see playbooks/sample-testnet-profile.yaml for the structure). Each entry
# renders /etc/node-transition.d/<name>.conf, read by node-transition.sh.
# Empty by default: nothing in this repo names a validator, host or key.
transition_peers: []
# Optional cluster RPC used by node-transition.sh for catch-up checks (local
# slot vs cluster slot). Falls back to `solana catchup` when empty.
transition_cluster_rpc_url: "{{ remote_cluster_rpc_address | default('') }}"
