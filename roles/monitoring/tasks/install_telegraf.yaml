---

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_distribution == 'Ubuntu'
  tags:
    - telegraf.install

- name: Download InfluxData GPG key
  ansible.builtin.shell: |
    curl -fsSL https://repos.influxdata.com/influxdata-archive.key | gpg --dearmor -o /etc/apt/keyrings/influxdata-archive.gpg
  args:
    creates: /etc/apt/keyrings/influxdata-archive.gpg
  when: ansible_distribution == 'Ubuntu'
  tags:
    - telegraf.install

- name: Set permissions on GPG keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/influxdata-archive.gpg
    mode: '0644'
  when: ansible_distribution == 'Ubuntu'
  tags:
    - telegraf.install

- name: Add telegraf repo with signed-by
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/influxdata-archive.gpg] https://repos.influxdata.com/debian stable main"
    state: present
    filename: influxdata
  when: ansible_distribution == 'Ubuntu'
  tags:
    - telegraf.install

- name: apt update
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_distribution == 'Ubuntu'
  tags:
    - telegraf.install

- name: Install telegraf
  package:
    name: telegraf
    state: present
  tags:
    - telegraf.install
